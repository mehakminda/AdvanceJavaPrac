spring.application.name=KafkaConsumer1
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=telusko-CG
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=com.learning.telusko.kafkaconsumer1.model
## deserialize the classes which comes under this package.



spring.kafka.consumer.properties.spring.json.trusted.packages=com.learning.telusko.kafkaconsumer1.model,com.learning.telusko.kafkaproducer1.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.learning.telusko.kafkaconsumer1.model.Course
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# in kafka header, Spring Kafka stored the Java class name in headers during JSON serialization at producer end, and the consumer used that header to decide what class to deserialize into. That is why trusted packages became important.
#Using spring.json.use.type.headers=false tells the consumer to ignore the producer’s type header and always deserialize into your consumer-side Course class.